[project]
name = "namportfolio"
version = "0.1.0"
description = "アクティブ運用戦略のパフォーマンス評価・可視化"
readme = "README.md"
requires-python = ">=3.11"
# 社内環境の pandas 2.1.4 / numpy 1.26.3 / matplotlib 3.10.3 / Python 3.12 で
# テストが通ることを確認済み。pandas 2.1 では "ME" などの頻度文字列と
# groupby.apply(include_groups=) が使えないため、下限を 2.1 に切っている。
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.6",  # layout="constrained" が要る
]
# ノートブックでインタラクティブに見たい場合。図は自分で組み立て、
# npf.viz.plotly.apply_theme で見た目だけ揃える
plotly = [
    "plotly>=5.18",
]
stats = [
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]
# pip でも入れられるよう、開発依存は dependency-groups（PEP 735）ではなく
# optional-dependencies に置く。古い pip は --group に対応していない。
dev = [
    "matplotlib>=3.6",
    "plotly>=5.18",
    "pytest>=8.0",
    "ruff>=0.6",
]

# setuptools を使う。社内環境では `pip install . --no-build-isolation` で
# 入れるため、ビルドバックエンドは**その環境に既に入っているもの**でなければ
# ならない。hatchling は入っていないことがあるが、setuptools はほぼ常駐する。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["namportfolio*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
# __all__ は機能カテゴリ順に並べたいのでソート強制は外す
ignore = ["RUF022"]
