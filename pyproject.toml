[project]
name = "namportfolio"
version = "0.1.0"
description = "アクティブ運用戦略のパフォーマンス評価・可視化"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
stats = [
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]
# pip でも入れられるよう、開発依存は dependency-groups（PEP 735）ではなく
# optional-dependencies に置く。古い pip は --group に対応していない。
dev = [
    "matplotlib>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

# setuptools を使う。社内環境では `pip install . --no-build-isolation` で
# 入れるため、ビルドバックエンドは**その環境に既に入っているもの**でなければ
# ならない。hatchling は入っていないことがあるが、setuptools はほぼ常駐する。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["namportfolio*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
# __all__ は機能カテゴリ順に並べたいのでソート強制は外す
ignore = ["RUF022"]
